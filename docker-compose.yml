services:
  content-factory:
    build: .
    container_name: tiktok-content-factory
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8787:8000"
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
